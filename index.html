<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<title>Will you be my Valentine?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
  --bg1: #ffd6e7;
  --bg2: #ffeef6;
  --card: #ffffffee;
  --yes: #ff3b7a;
  --yesHover: #ff1f68;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  font-family: system-ui, sans-serif;
  overflow: hidden;
  padding: 12px;
}

/* CONFETTI */
#confettiCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* CARD */
.card {
  width: 100%;
  max-width: 420px;
  padding: 20px 16px 24px;
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.15);
}

.art {
  width: 220px;
  max-width: 80%;
  margin: 0 auto 8px;
  display: block;
}

h1 {
  font-size: 26px;
  margin: 12px 0 18px;
}

/* BUTTON ZONE */
.button-zone {
  position: relative;
  width: 100%;
  height: 180px;
  margin-top: 10px;
  touch-action: none;
}

button {
  position: absolute;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: 800;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(0,0,0,.18);
  user-select: none;
  transition: transform .12s ease, background .12s ease;
}

#yesBtn {
  left: 10%;
  top: 50%;
  transform: translateY(-50%);
  background: var(--yes);
  color: #fff;
}

#noBtn {
  left: 55%;
  top: 50%;
  transform: translateY(-50%);
  background: #e5e7eb;
}

.hint {
  margin-top: 12px;
  font-size: 13px;
  opacity: .7;
}

/* RESULT */
.result {
  display: none;
  margin-top: 18px;
  animation: pop .35s ease;
}

.result h2 {
  font-size: 34px;
}

.fireworks {
  width: 100%;
  max-width: 300px;
}

@keyframes pop {
  from { transform: scale(.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>

<main class="card">

<!-- SAME SVG -->
<svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur" x1="0" x2="1">
      <stop offset="0" stop-color="#f7c7a1"/>
      <stop offset="1" stop-color="#f2a97b"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4d7d"/>
      <stop offset="1" stop-color="#ff1f68"/>
    </linearGradient>
  </defs>

  <path d="M250 50 C250 33 270 25 282 38
           C294 25 314 33 314 50
           C314 78 282 92 282 106
           C282 92 250 78 250 50Z"
        fill="url(#heart)"/>

  <path d="M90 120 C90 70 140 40 190 60
           C240 40 290 70 290 120
           C290 180 240 210 190 210
           C140 210 90 180 90 120Z"
        fill="url(#fur)"/>

  <circle cx="160" cy="130" r="8"/>
  <circle cx="220" cy="130" r="8"/>
</svg>

<h1>Nirali, will you be my Valentine? 💖</h1>

<section class="button-zone" id="zone">
  <button id="yesBtn">Yes</button>
  <button id="noBtn">No</button>
</section>

<div class="hint" id="hint">Try tapping “No” 😈</div>

<section class="result" id="result">
  <h2>YAY!!! 🎉</h2>
  <img class="fireworks"
    src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif">
</section>

</main>

<script>
const zone = document.getElementById("zone");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const hint = document.getElementById("hint");

/* CONFETTI */
const canvas = document.getElementById("confettiCanvas");
const confettiInstance = confetti.create(canvas, { resize: true });

/* YES GROWS */
let yesScale = 1;
function growYes() {
  yesScale = Math.min(2.3, yesScale + 0.12);
  yesBtn.style.transform =
    `translateY(-50%) scale(${yesScale})`;
}

/* NO RUNS (TOUCH FRIENDLY) */
function moveNo(x, y) {
  const z = zone.getBoundingClientRect();
  const b = noBtn.getBoundingClientRect();

  let nx = Math.random() * (z.width - b.width);
  let ny = Math.random() * (z.height - b.height);

  noBtn.style.left = nx + "px";
  noBtn.style.top = ny + "px";
  noBtn.style.transform = "none";

  growYes();
}

zone.addEventListener("pointerdown", e => {
  const b = noBtn.getBoundingClientRect();
  const d = Math.hypot(
    (b.left + b.width/2) - e.clientX,
    (b.top + b.height/2) - e.clientY
  );
  if (d < 160) moveNo(e.clientX, e.clientY);
});

noBtn.addEventListener("click", e => e.preventDefault());

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  zone.style.display = "none";
  hint.style.display = "none";
  result.style.display = "block";

  confettiInstance({
    particleCount: 250,
    spread: 140,
    startVelocity: 55,
    origin: { x: 0.5, y: 0.6 }
  });
});
</script>
</body>
</html>
